<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>إدارة وتحديث بيانات الفوج السحابية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root{ --ink:#1c1c1e; --sand:#f7f3ea; --card:#fffdf8; --gold:#b8934a; --line:#e7ded0; --green:#2f5233; --danger:#8a2a2a; }
*{box-sizing:border-box; margin:0; padding:0; font-family:'Tajawal',sans-serif;}
body{ background:radial-gradient(1200px 600px at 50% -10%, #fbf8f1 0%, var(--sand) 55%); color:var(--ink); padding:20px 12px 60px; display:flex; justify-content:center; min-height:100vh; }
.box{ width:100%; max-width:520px; background:var(--card); border-radius:16px; border:1px solid var(--line); padding:22px; box-shadow:0 8px 24px rgba(0,0,0,0.06); }
h2{ font-size:18px; font-weight:800; margin-bottom:4px; text-align:center; }
p.desc{ font-size:12px; color:#666; margin-bottom:14px; text-align:center; }

.section{ font-size:13px; font-weight:800; color:var(--gold); margin:12px 0 6px; border-bottom:1px solid var(--line); padding-bottom:4px; }
label{ display:block; font-size:11.5px; font-weight:700; margin:6px 0 3px; color:#444; }
input{ width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; outline:none; background:#fff; margin-bottom:6px; }
input:focus{ border-color:var(--gold); }
.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.btn-save{ width:100%; padding:13px; background:var(--green); color:#fff; font-size:15px; font-weight:700; border:none; border-radius:10px; cursor:pointer; margin-top:14px; }
.btn-save:active{ transform:scale(.98); }

#result-panel{ display:none; flex-direction:column; align-items:center; margin-top:16px; padding-top:16px; border-top:1px dashed var(--line); }
#qrcode{ background:#fff; padding:10px; border:1px solid var(--line); border-radius:8px; margin-bottom:10px; }
.url-text{ font-size:11px; color:#0066cc; word-break:break-all; text-align:center; margin-bottom:10px; }
.action-row{ display:flex; gap:8px; width:100%; }
.action-row a, .action-row button{ flex:1; text-align:center; padding:9px; font-size:12.5px; font-weight:700; border-radius:8px; text-decoration:none; cursor:pointer; }
.btn-view{ background:#fff; color:var(--ink); border:1px solid var(--line); display:inline-flex; align-items:center; justify-content:center; }
.btn-download{ background:var(--ink); color:#fff; border:none; }
</style>
</head>
<body>

<div class="box">
  <h2>لوحة التحكم السحابية للأفواج</h2>
  <p class="desc">أدخل معرّف الفوج والرمز السري لتحديث بيانات السكن وأرقام المشرفين فوراً.</p>

  <div class="section">بيانات اعتماد الفوج</div>
  <div class="grid-2">
    <div>
      <label>معرّف الفوج (Group ID):</label>
      <input type="text" id="group_id" placeholder="مثال: A1">
    </div>
    <div>
      <label>الرمز السري (PIN):</label>
      <input type="password" id="pin" placeholder="الرمز السري">
    </div>
  </div>

  <div class="section">أرقام هواتف المشرفين</div>
  <label>رقم المشرف الأساسي:</label>
  <input type="text" id="p1" placeholder="+966500000000">

  <label>رقم المشرف الاحتياطي:</label>
  <input type="text" id="p2" placeholder="+966500000000">

  <div class="section">فندق مكة المكرمة</div>
  <div class="grid-2">
    <input type="text" id="hm" placeholder="اسم الفندق والشارع">
    <input type="text" id="rm" placeholder="رقم الغرفة">
  </div>
  <input type="text" id="mm" placeholder="رابط خرائط جوجل لفندق مكة">

  <div class="section">فندق المدينة المنورة</div>
  <div class="grid-2">
    <input type="text" id="hd" placeholder="اسم الفندق - المركزية">
    <input type="text" id="rd" placeholder="رقم الغرفة">
  </div>
  <input type="text" id="md" placeholder="رابط خرائط جوجل لفندق المدينة">

  <button class="btn-save" id="save-btn" onclick="saveToCloud()">حفظ التعديلات في السحابة ☁️</button>

  <div id="result-panel">
    <div id="qrcode"></div>
    <div class="url-text" id="link-preview"></div>
    <div class="action-row">
      <a href="#" id="view-btn" target="_blank" class="btn-view">معاينة بطاقة الفوج 👁️</a>
      <button class="btn-download" onclick="downloadQR()">تحميل QR الفوج 💾</button>
    </div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbym7UuoDjcJkqrp7XqRpzkJdwm3h5ecwY814hxYmdD60fLMKZPqMt0cQFbJPKTteQ/exec";

window.onload = function(){
  const p = new URLSearchParams(window.location.search);
  const g = p.get('g') || p.get('group');
  if(g){
    document.getElementById('group_id').value = g;
    fetchGroupData(g);
  }
};

async function fetchGroupData(groupId){
  try {
    const res = await fetch(`${API_URL}?g=${encodeURIComponent(groupId)}`);
    const data = await res.json();
    if(!data.error){
      document.getElementById('p1').value = data.p1 || "";
      document.getElementById('p2').value = data.p2 || "";
      document.getElementById('hm').value = data.hm || "";
      document.getElementById('rm').value = data.rm || "";
      document.getElementById('mm').value = data.mm || "";
      document.getElementById('hd').value = data.hd || "";
      document.getElementById('rd').value = data.rd || "";
      document.getElementById('md').value = data.md || "";
    }
  } catch(e){}
}

async function saveToCloud(){
  const get = id => document.getElementById(id).value.trim();
  const groupId = get('group_id');
  const pin = get('pin');

  if(!groupId || !pin){
    alert("يرجى إدخال معرّف الفوج والرمز السري!");
    return;
  }

  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = "جاري الحفظ بالسحابة...";

  const payload = {
    group_id: groupId,
    pin: pin,
    p1: get('p1'),
    p2: get('p2'),
    hm: get('hm'),
    rm: get('rm'),
    mm: get('mm'),
    hd: get('hd'),
    rd: get('rd'),
    md: get('md')
  };

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    });
    const result = await res.json();

    if(result.success){
      alert("✅ تم حفظ وتحديث بيانات الفوج في السحابة بنجاح!");
      showQR(groupId);
    } else {
      alert("❌ خطأ: " + (result.msg || "تعذر الحفظ"));
    }
  } catch(err){
    alert("❌ حدث خطأ أثناء الاتصال بالسيرفر");
  } finally {
    btn.disabled = false;
    btn.textContent = "حفظ التعديلات في السحابة ☁️";
  }
}

function showQR(groupId){
  const targetUrl = `https://abdallahm321.github.io/pilgrim-card/?g=${encodeURIComponent(groupId)}`;
  const panel = document.getElementById('result-panel');
  const qrBox = document.getElementById('qrcode');
  qrBox.innerHTML = "";
  new QRCode(qrBox, { text: targetUrl, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.H });

  document.getElementById('link-preview').textContent = targetUrl;
  document.getElementById('view-btn').href = targetUrl;
  panel.style.display = "flex";
}

function downloadQR(){
  const img = document.querySelector('#qrcode img');
  if(!img) return;
  const link = document.createElement('a');
  link.download = `group-${document.getElementById('group_id').value || 'card'}-qr.png`;
  link.href = img.src;
  link.click();
}
</script>
</body>
</html>
