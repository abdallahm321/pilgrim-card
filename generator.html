<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>لوحة التحكم الإدارية للأفواج</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{ --ink:#1c1c1e; --gold:#b8934a; --green:#2f5233; --line:#e7ded0; --card:#fffdf8; }
body{ background:#f7f3ea; padding:20px; font-family:'Tajawal',sans-serif; }
.box{ max-width:500px; margin:auto; background:var(--card); padding:20px; border-radius:16px; border:1px solid var(--line); box-shadow:0 10px 25px rgba(0,0,0,0.05); }
.mode-selector{ display:flex; gap:10px; margin-bottom:20px; }const API_URL = "https://script.google.com/macros/s/AKfycbxJhFjnjFT70f_82YsII66RVoR7d5xsg5taB6hip5HAcCAnsBxcEhIZcKpB5p22C8-I/exec";
.mode-btn{ flex:1; padding:10px; border:1px solid var(--gold); background:transparent; color:var(--gold); border-radius:8px; cursor:pointer; font-weight:700; }
.mode-btn.active{ background:var(--gold); color:#fff; }
.generator-field{ margin-bottom:12px; }
label{ font-size:12px; font-weight:700; color:#555; display:block; margin-bottom:4px; }
input, textarea{ width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; outline:none; }
.btn-main{ width:100%; padding:14px; background:var(--green); color:#fff; border:none; border-radius:10px; font-weight:800; cursor:pointer; margin-top:10px; }
#result-panel{ display:none; margin-top:20px; text-align:center; padding-top:20px; border-top:1px dashed var(--line); }
</style>
</head>
<body>
<div class="box">
  <div class="mode-selector">
    <button class="mode-btn active" id="btn-add" onclick="setMode('add')">➕ إضافة فوج</button>
    <button class="mode-btn" id="btn-edit" onclick="setMode('edit')">✏️ تعديل فوج</button>
  </div>
  <h2 id="form-title" style="text-align:center; margin-bottom:15px;">إضافة فوج جديد</h2>
  
  <div class="generator-field">
    <label>معرّف الفوج (Group ID): <button id="gen-btn" class="btn-random" onclick="generateRandomID()">توليد كود</button></label>
    <input type="text" id="group_id" onblur="autoLoad()">
  </div>
  <div class="generator-field">
    <label>الرمز السري (PIN):</label>
    <input type="password" id="pin" placeholder="يستخدم لمرة واحدة عند الحفظ أو للتعديل">
  </div>
  <div id="form-fields">
    <label>اسم الشركة:</label><input type="text" id="company_name">
    <label>هاتف المشرف:</label><input type="text" id="p1">
    <label>فندق مكة:</label><input type="text" id="hm">
    <label>رقم غرفة مكة:</label><input type="text" id="rm">
    <label>ملاحظات:</label><textarea id="notes"></textarea>
    <button class="btn-main" onclick="saveToCloud()">حفظ البيانات ☁️</button>
  </div>
  <div id="result-panel"><div id="qrcode"></div><p id="link-preview"></p></div>
</div>

<script>
const API_URL = "استبدل_بهذا_رابط_السكربت_الخاص_بك";
function setMode(mode) {
  document.getElementById('btn-add').classList.toggle('active', mode === 'add');
  document.getElementById('btn-edit').classList.toggle('active', mode === 'edit');
  document.getElementById('gen-btn').style.display = (mode === 'edit') ? 'none' : 'inline-block';
  document.getElementById('form-title').textContent = mode === 'add' ? "إضافة فوج جديد" : "تعديل فوج قائم";
}
async function autoLoad() {
  if(document.getElementById('btn-edit').classList.contains('active')) {
    // جلب البيانات تلقائياً عند تغيير الـ ID في وضع التعديل
  }
}
async function saveToCloud() { /* نفس كود الحفظ السابق */ }
function generateRandomID() { document.getElementById('group_id').value = 'F-' + Math.floor(Math.random()*9000+1000); }
</script>
</body>
</html>
