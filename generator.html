<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>لوحة التحكم الإدارية للأفواج</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root{ --ink:#1c1c1e; --gold:#b8934a; --green:#2f5233; --line:#e7ded0; --card:#fffdf8; }
body{ background:#f7f3ea; padding:20px; font-family:'Tajawal',sans-serif; }
.box{ max-width:500px; margin:auto; background:var(--card); padding:20px; border-radius:16px; border:1px solid var(--line); box-shadow:0 10px 25px rgba(0,0,0,0.05); }

.mode-selector{ display:flex; gap:10px; margin-bottom:20px; }
.mode-btn{ flex:1; padding:10px; border:1px solid var(--gold); background:transparent; color:var(--gold); border-radius:8px; cursor:pointer; font-weight:700; }
.mode-btn.active{ background:var(--gold); color:#fff; }

.generator-field{ margin-bottom:12px; }
label{ font-size:12px; font-weight:700; color:#555; display:block; margin-bottom:4px; }
input, textarea{ width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; outline:none; }
input:focus{ border-color:var(--gold); }

.btn-main{ width:100%; padding:14px; background:var(--green); color:#fff; border:none; border-radius:10px; font-weight:800; cursor:pointer; }
.btn-random{ background:#eee; color:var(--ink); border:none; padding:5px 10px; border-radius:4px; font-size:10px; cursor:pointer; }

#result-panel{ display:none; margin-top:20px; text-align:center; padding-top:20px; border-top:1px dashed var(--line); }
</style>
</head>
<body>

<div class="box">
  <div class="mode-selector">
    <button class="mode-btn active" id="btn-add" onclick="setMode('add')">➕ فوج جديد</button>
    <button class="mode-btn" id="btn-edit" onclick="setMode('edit')">✏️ تعديل فوج</button>
  </div>

  <h2 id="form-title" style="text-align:center; margin-bottom:15px;">إضافة فوج جديد</h2>

  <div class="generator-field">
    <label>معرّف الفوج (Group ID): <button class="btn-random" onclick="generateRandomID()">توليد كود</button></label>
    <input type="text" id="group_id" placeholder="مثال: H-2026-X1">
  </div>
  
  <div class="generator-field">
    <label>الرمز السري (PIN) - للحماية:</label>
    <input type="password" id="pin" placeholder="يجب حفظ هذا الرمز لتعديل بياناتك لاحقاً">
  </div>

  <div id="form-fields" style="display:none;">
    <label>اسم الشركة:</label>
    <input type="text" id="company_name">
    
    <label>رقم هاتف المشرف الأساسي:</label>
    <input type="text" id="p1" placeholder="+966...">
    
    <label>رقم هاتف المشرف الاحتياطي:</label>
    <input type="text" id="p2">

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <div><label>فندق مكة:</label><input type="text" id="hm"></div>
        <div><label>غرفة مكة:</label><input type="text" id="rm"></div>
    </div>
    <label>رابط موقع مكة:</label>
    <input type="text" id="mm">

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <div><label>فندق المدينة:</label><input type="text" id="hd"></div>
        <div><label>غرفة المدينة:</label><input type="text" id="rd"></div>
    </div>
    <label>رابط موقع المدينة:</label>
    <input type="text" id="md">

    <label>ملاحظات:</label>
    <textarea id="notes"></textarea>

    <button class="btn-main" onclick="saveToCloud()">حفظ وإصدار البطاقة ☁️</button>
  </div>

  <div id="result-panel">
    <div id="qrcode" style="display:inline-block;"></div>
    <p id="link-preview" style="font-size:12px; margin:10px 0;"></p>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwk1Uw_1_Dh-5vxOHJGN7tBP_GKhJX7V5SFIgTJXtynamC6ikoU4KTFf2r16tHCCOT3/exec";

function setMode(mode) {
  document.getElementById('btn-add').classList.toggle('active', mode === 'add');
  document.getElementById('btn-edit').classList.toggle('active', mode === 'edit');
  document.getElementById('form-fields').style.display = 'block';
  document.getElementById('form-title').textContent = mode === 'add' ? "إضافة فوج جديد" : "تعديل فوج قائم";
  document.getElementById('group_id').readOnly = (mode === 'edit');
}

function generateRandomID() {
  const id = 'F-' + Math.floor(Math.random() * 9000 + 1000);
  document.getElementById('group_id').value = id;
}

async function saveToCloud() {
  const get = id => document.getElementById(id).value.trim();
  const groupId = get('group_id');
  const pin = get('pin');

  if(!groupId || !pin) return alert("يرجى إدخال المعرف والرمز السري");

  // ملاحظة: الـ Google Script هو من سيتأكد من مطابقة الـ PIN الموجودة في الشيت
  // الحماية هنا: الـ API لا يعيد البيانات إلا إذا تطابق الـ PIN
  const btn = document.querySelector('.btn-main');
  btn.innerText = "جاري الحفظ...";
  
  // بناء الرابط المباشر
  const url = `${API_URL}?action=update&group_id=${groupId}&pin=${pin}&company_name=${get('company_name')}&p1=${get('p1')}&p2=${get('p2')}&hm=${get('hm')}&rm=${get('rm')}&mm=${get('mm')}&hd=${get('hd')}&rd=${get('rd')}&md=${get('md')}&bus_no=${get('bus_no')}&notes=${get('notes')}`;
  
  try {
    const response = await fetch(url);
    const result = await response.json();
    if(result.success) {
      alert("تم الحفظ بنجاح");
      document.getElementById('result-panel').style.display = 'block';
      new QRCode(document.getElementById('qrcode'), `https://abdallahm321.github.io/pilgrim-card/?g=${groupId}`);
    } else {
      alert("خطأ: تأكد من صحة الرمز السري إذا كنت تعدل فوجاً موجوداً");
    }
  } catch(e) { alert("خطأ في الاتصال"); }
  btn.innerText = "حفظ وإصدار البطاقة";
}
</script>
</body>
</html>
